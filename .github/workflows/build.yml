name: Build BumbleHeatFix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install ldid
        run: |
          brew install ldid-procursus

      - name: Verify Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS"
          echo "Checking common.mk:"
          test -f "$THEOS/makefiles/common.mk"
          echo "Checking ldid:"
          which ldid
          ldid -h || true

      - name: Build BumbleHeatFix
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

    - name: Inspect Theos staging
  run: |
    echo "=== Packages ==="
    find packages -type f -print 2>/dev/null || true

    echo "=== Dylibs ==="
    find .theos -type f -name "*.dylib" -print 2>/dev/null || true

    echo "=== Theos directory ==="
    find .theos -maxdepth 6 -type f -print 2>/dev/null || true

    echo "=== Project directory ==="
    find . -maxdepth 6 -type f -print 2>/dev/null || true

    echo "=== Stage directories ==="
    find .theos -type d -print 2>/dev/null || true
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BumbleHeatFix
          path: |
            packages/*
            .theos/obj/**/*.dylib
          if-no-files-found: error
