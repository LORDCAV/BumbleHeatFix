name: Build BumbleHeatFix dylib

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: macos-14

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install Theos
    run: |
      git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

  - name: Install ldid
    run: |
      brew install ldid-procursus

  - name: Build dylib
    run: |
      export THEOS="$HOME/theos"
      make clean
      make package FINALPACKAGE=1

  - name: Verify dylib
    run: |
      echo "=== DYLIB ==="
      find .theos -type f -name "BumbleHeatFix.dylib" -print

      echo "=== PLIST ==="
      find .theos -type f -name "BumbleHeatFix.plist" -print

      echo "=== PACKAGE ==="
      find packages -type f -name "*.deb" -print 2>/dev/null || true

  - name: Upload dylib and plist
    uses: actions/upload-artifact@v4
    with:
      name: BumbleHeatFix-dylib
      path: |
        .theos/_/Library/MobileSubstrate/DynamicLibraries/BumbleHeatFix.dylib
        .theos/_/Library/MobileSubstrate/DynamicLibraries/BumbleHeatFix.plist
      if-no-files-found: error
