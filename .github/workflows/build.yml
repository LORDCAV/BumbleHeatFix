name: Build BumbleHeatFix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Verify Theos
        run: |
          echo "HOME=$HOME"
          echo "Theos location:"
          ls -la "$HOME/theos"
          echo "Checking common.mk:"
          ls -la "$HOME/theos/makefiles/common.mk"

      - name: Build BumbleHeatFix
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS"
          echo "Checking:"
          test -f "$THEOS/makefiles/common.mk"
          make package FINALPACKAGE=1

      - name: Show build output
        run: |
          echo "=== Packages ==="
          find packages -type f -print 2>/dev/null || true

          echo "=== Dylibs ==="
          find .theos -type f -name "*.dylib" -print 2>/dev/null || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BumbleHeatFix
          path: |
            packages/*
            .theos/obj/**/*.dylib
          if-no-files-found: error
