name: Build BumbleHeatFix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install ldid
        run: |
          brew install ldid-procursus

      - name: Build tweak
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package FINALPACKAGE=1

      - name: Show build output
        run: |
          echo "=== Packages ==="
          find packages -type f -print 2>/dev/null || true

          echo "=== Dylibs ==="
          find .theos -type f -name "*.dylib" -print 2>/dev/null || true

          echo "=== Staged files ==="
          find .theos/_ -type f -print 2>/dev/null || true

      - name: Prepare dylib artifact
        run: |
          mkdir -p artifact

          cp .theos/_/Library/MobileSubstrate/DynamicLibraries/BumbleHeatFix.dylib \
             artifact/BumbleHeatFix.dylib

          cp .theos/_/Library/MobileSubstrate/DynamicLibraries/BumbleHeatFix.plist \
             artifact/BumbleHeatFix.plist

          echo "=== Artifact contents ==="
          ls -lh artifact/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BumbleHeatFix-dylib
          path: artifact/*
          if-no-files-found: error
          compression-level: 6
          overwrite: true
